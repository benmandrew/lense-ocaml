<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lense-ocaml</title>
  <meta name="description" content="How OCaml values are represented at runtime, read from compiler-libs in the browser">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- og.png comes from `npm run thumbnail`. -->
  <meta property="og:title" content="lense-ocaml">
  <meta property="og:description" content="How OCaml values are represented at runtime, read from compiler-libs in the browser">
  <meta property="og:type" content="website">
  <meta property="og:image" content="og.png">
  <meta property="og:image:alt" content="OCaml source for a variant type next to its representation: Empty is immediate 0, and Circle and Rect are blocks with tags 0 and 1, drawn as columns of words that point to boxed floats">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="bar">
    <h1>lense-ocaml</h1>
    <label>Example <select id="example"></select></label>
    <label>File
      <select id="kind">
        <option value="ml">.ml</option>
        <option value="mli">.mli</option>
      </select>
    </label>
    <label>Compiler
      <select id="compiler">
        <option value="5.5">OCaml 5.5</option>
        <option value="ox">OxCaml</option>
      </select>
    </label>
    <label><input type="checkbox" id="values"> closures, lazy values and objects</label>
    <label>Closures in
      <select id="backend">
        <option value="native">native code</option>
        <option value="bytecode">bytecode</option>
      </select>
    </label>
    <label><input type="checkbox" id="labels"> variant labels only</label>
    <span id="status" role="status" aria-live="polite"></span>
  </header>
  <main>
    <section id="editor" aria-label="Source"></section>
    <section id="output" aria-label="Representations"></section>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
